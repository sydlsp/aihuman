data:
  data_dir: '/data/shipu/train_data_full/train_data_hdkp'
  sample_size:  [512, 512]
  sample_stride: 4
  sample_n_frames: 8

solver:
  gradient_accumulation_steps: 1
  mixed_precision: 'fp16'
  enable_xformers_memory_efficient_attention: True 
  gradient_checkpointing: False 
  max_train_steps: 200000
  max_grad_norm: 1.0
  # lr
  learning_rate: 5e-5
  scale_lr: False 
  lr_warmup_steps: 1
  lr_scheduler: 'cosine' # 'constant'  # 这里我们修改一下学习率调度器的模式  'cosine'

  # optimizer
  use_8bit_adam: True 
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay:  1.0e-2
  adam_epsilon: 1.0e-8

val:
  validation_steps: 500
  validation_steps_tuple: [1, 10, 50, 100, 150, 200,250,300,350,400,450,500]


noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start:          0.00085
  beta_end:            0.012
  beta_schedule:       "scaled_linear"
  steps_offset:        1
  clip_sample:         false

base_model_path: '/data/shipu/pretrained_model/stable-diffusion-v1-5'
vae_model_path: '/data/shipu/pretrained_model/sd-vae-ft-mse'
image_encoder_path: '/data/shipu/pretrained_model/image_encoder'
controlnet_openpose_path: ''

train_bs: 6

weight_dtype: 'fp16'  # [fp16, fp32]
uncond_ratio: 0.1
noise_offset: 0.05
snr_gamma: 5.0
enable_zero_snr: True 
pose_guider_pretrain: True 

seed: 8888
resume_from_checkpoint: ''
checkpointing_steps: 2000
save_model_epoch_interval: 5
exp_name: 'exp_3_stage1'
output_dir: '/data/shipu/ani_train_ckpt'

